<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iklas Anang Subekti - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff', 400: '#818cf8', 500: '#6366f1',
                            600: '#4f46e5', accent: '#06b6d4', purple: '#a855f7',
                            dark: '#0b0f19', card: '#111827', border: '#1f2937'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.08) 0%, transparent 40%);
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(31, 41, 55, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-4px);
        }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #06b6d4 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="font-sans antialiased text-gray-200 min-h-screen flex flex-col justify-between">

    <!-- NAVIGATION BAR -->
    <header class="fixed top-0 left-0 w-full z-40 glass-panel border-b border-gray-800/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="#" class="flex items-center gap-2">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-500 to-brand-accent flex items-center justify-center font-bold font-mono text-white text-lg">IA</div>
                    <span class="font-bold text-lg tracking-tight font-mono text-white">SUBEKTI<span class="text-brand-accent">.dev</span></span>
                </a>

                <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
                    <a href="#about" class="text-gray-300 hover:text-brand-accent">Tentang Saya</a>
                    <a href="#projects" class="text-gray-300 hover:text-brand-accent">Proyek</a>
                    <a href="#git-admin" class="text-gray-300 hover:text-brand-accent flex items-center gap-1.5"><i class="fa-brands fa-git-alt text-orange-400"></i> Git CMS</a>
                </nav>

                <div class="flex items-center gap-3">
                    <button onclick="toggleAdminModal()" class="px-3.5 py-1.5 rounded-lg text-xs font-mono font-medium border border-brand-500/30 bg-brand-500/10 text-brand-400 hover:bg-brand-500 hover:text-white transition-all flex items-center gap-2">
                        <i class="fa-solid fa-lock text-[10px]"></i>
                        <span>CMS Admin</span>
                    </button>
                    <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-lg text-gray-400 hover:text-white">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobileMenu" class="hidden md:hidden glass-panel border-b border-gray-800 px-4 pt-2 pb-4 space-y-3">
            <a href="#about" onclick="toggleMobileMenu()" class="block text-gray-300 py-1">Tentang Saya</a>
            <a href="#projects" onclick="toggleMobileMenu()" class="block text-gray-300 py-1">Proyek</a>
            <a href="#git-admin" onclick="toggleMobileMenu()" class="block text-gray-300 py-1">Git CMS Workflow</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="pt-24 pb-16 flex-grow">
        <!-- HERO SECTION -->
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-20">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                <div class="lg:col-span-7 space-y-6 text-center lg:text-left">
                    <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight">
                        Halo, Saya <br class="hidden sm:inline"/>
                        <span class="gradient-text">Iklas Anang Subekti</span>
                    </h1>
                    <p class="text-lg sm:text-xl text-gray-400 font-mono">&lt;<span class="text-brand-accent">Full-Stack Developer</span> /&gt;</p>
                </div>
            </div>
        </section>

        <!-- PROJECTS SECTION -->
        <section id="projects" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 border-t border-gray-800/60">
            <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
                <div>
                    <h2 class="text-xs font-mono uppercase tracking-widest text-brand-accent font-semibold mb-2">// PORTOFOLIO PROYEK</h2>
                    <h3 class="text-3xl font-extrabold text-white">Karya Terbaru</h3>
                </div>
                <div class="flex flex-wrap gap-2 p-1.5 rounded-xl glass-panel border border-gray-800 text-xs font-medium">
                    <button onclick="filterProjects('all')" class="filter-btn px-4 py-2 rounded-lg bg-brand-600 text-white" data-filter="all">Semua</button>
                    <button onclick="filterProjects('webapp')" class="filter-btn px-4 py-2 rounded-lg text-gray-400" data-filter="webapp">Web App</button>
                    <button onclick="filterProjects('iot')" class="filter-btn px-4 py-2 rounded-lg text-gray-400" data-filter="iot">IoT</button>
                </div>
            </div>

            <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Cards will render dynamically -->
            </div>
        </section>

        <!-- GIT ADMIN EXPLANATION SECTION -->
        <section id="git-admin" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 border-t border-gray-800/60">
            <div class="glass-panel rounded-3xl p-8 border border-brand-500/20 text-center space-y-4">
                <h3 class="text-2xl font-extrabold text-white">Kelola Portofolio via GitHub CMS</h3>
                <button onclick="toggleAdminModal()" class="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 font-medium text-white text-sm">
                    Buka Panel Admin CMS
                </button>
            </div>
        </section>
    </main>

    <!-- ADMIN MODAL -->
    <div id="adminModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-xl rounded-2xl border border-gray-700 p-6 relative">
            <button onclick="toggleAdminModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-lg font-bold text-white mb-4">GitHub CMS Admin Panel</h3>
            
            <form id="projectForm" onsubmit="handleSaveProject(event)" class="space-y-4 text-xs">
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="ghOwner" placeholder="Owner (e.g. XL4AS)" class="bg-gray-900 border border-gray-700 p-2 rounded text-white font-mono">
                    <input type="text" id="ghRepo" placeholder="Repo (e.g. my-portfolio)" class="bg-gray-900 border border-gray-700 p-2 rounded text-white font-mono">
                    <input type="password" id="ghToken" placeholder="Personal Access Token" class="bg-gray-900 border border-gray-700 p-2 rounded text-white font-mono">
                </div>

                <input type="text" id="pTitle" required placeholder="Judul Proyek" class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded text-white">
                
                <div class="grid grid-cols-2 gap-2">
                    <select id="pCategory" class="bg-gray-900 border border-gray-700 p-2.5 rounded text-white">
                        <option value="webapp">Web Application</option>
                        <option value="iot">IoT</option>
                    </select>
                    <input type="text" id="pTech" placeholder="Tech Stack (Laravel, MySQL)" class="bg-gray-900 border border-gray-700 p-2.5 rounded text-white">
                </div>

                <textarea id="pDesc" rows="3" required placeholder="Deskripsi Singkat" class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded text-white"></textarea>
                
                <div id="statusMessage" class="hidden p-2.5 rounded font-mono"></div>

                <div class="flex justify-end gap-2">
                    <button type="button" onclick="toggleAdminModal()" class="px-4 py-2 border border-gray-700 rounded text-gray-300">Batal</button>
                    <button type="submit" id="btnSave" class="px-4 py-2 bg-brand-600 rounded text-white font-bold">Commit & Push</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Default Fallback Projects (Menjamin Tampilan Tidak Kosong)
        const defaultProjects = [
            {
                id: "project-01",
                title: "Sistem Informasi Pengelolaan Anggaran Daerah",
                category: "webapp",
                description: "Aplikasi manajemen alokasi dan realisasi anggaran berbasis web dengan verifikasi hirarki multi-user.",
                techStack: ["Laravel", "MySQL", "Bootstrap"],
                date: "2026-08-01"
            },
            {
                id: "project-02",
                title: "Smart Aquarium Telemetry & Feeder",
                category: "iot",
                description: "Sistem pemantauan kualitas air akuarium & pakan otomatis terhubung ke dashboard web real-time.",
                techStack: ["ESP32", "MQTT", "C++"],
                date: "2026-05-15"
            }
        ];

        let projectsData = [...defaultProjects];

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('ghOwner').value = localStorage.getItem('gh_owner') || 'XL4AS';
            document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || 'my-portfolio';
            document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
            fetchProjects();
        });

        function toggleAdminModal() {
            document.getElementById('adminModal').classList.toggle('hidden');
        }

        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        }

        async function fetchProjects() {
            try {
                const res = await fetch('data/projects.json');
                if (res.ok) {
                    projectsData = await res.json();
                }
            } catch (err) {
                console.warn("Menggunakan data fallback default:", err);
            } finally {
                renderProjects(projectsData);
            }
        }

        function renderProjects(projects) {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = projects.map(p => `
                <div class="project-card glass-card rounded-2xl p-6 flex flex-col">
                    <span class="text-[10px] font-mono font-bold text-brand-accent uppercase mb-2">${p.category}</span>
                    <h4 class="text-xl font-bold text-white mb-2">${p.title}</h4>
                    <p class="text-gray-400 text-sm mb-4 flex-grow">${p.description}</p>
                    <div class="flex flex-wrap gap-1 mb-4">
                        ${(p.techStack || []).map(t => `<span class="px-2 py-0.5 rounded text-[10px] font-mono bg-gray-800 text-gray-300">${t}</span>`).join('')}
                    </div>
                    <div class="text-[11px] font-mono text-gray-500 pt-2 border-t border-gray-800">${p.date || '2026'}</div>
                </div>
            `).join('');
        }

        function filterProjects(category) {
            if (category === 'all') {
                renderProjects(projectsData);
            } else {
                renderProjects(projectsData.filter(p => p.category === category));
            }
        }

        // Base64 Safe Encoding Function
        function utf8_to_b64(str) {
            return window.btoa(unescape(encodeURIComponent(str)));
        }

        async function handleSaveProject(e) {
            e.preventDefault();
            const owner = document.getElementById('ghOwner').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            const token = document.getElementById('ghToken').value.trim();

            if (!owner || !repo || !token) {
                alert('Harap isi Owner, Repo, dan Token!');
                return;
            }

            localStorage.setItem('gh_owner', owner);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);

            const newProject = {
                id: 'project-' + Date.now(),
                title: document.getElementById('pTitle').value,
                category: document.getElementById('pCategory').value,
                techStack: document.getElementById('pTech').value.split(',').map(s => s.trim()).filter(Boolean),
                description: document.getElementById('pDesc').value,
                date: new Date().toISOString().split('T')[0]
            };

            try {
                const path = 'data/projects.json';
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

                let sha = '';
                let currentContent = [...projectsData];

                const getRes = await fetch(apiUrl, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                    currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, '')))));
                }

                currentContent.unshift(newProject);

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `feat(cms): add project ${newProject.title}`,
                        content: utf8_to_b64(JSON.stringify(currentContent, null, 2)),
                        sha: sha || undefined
                    })
                });

                if (!putRes.ok) throw new Error('Gagal commit ke GitHub.');

                projectsData = currentContent;
                renderProjects(projectsData);
                toggleAdminModal();
                alert('Proyek berhasil dikomit ke GitHub!');
            } catch (err) {
                alert(`Error: ${err.message}`);
            }
        }
    </script>
</body>
</html>
